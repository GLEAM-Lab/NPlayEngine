[workspace]
resolver = "2"
members = ["crates/npe-core", "crates/npe-wasm", "crates/npe-runner", "crates/npe-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
